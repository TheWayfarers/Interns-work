<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS DOM Example</title>
    <style>
      body {
        font-family: Arial, sans-serif;;
        padding: 2rem;
      }
      button {
        margin-right: 0.5rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #output {
        margin-top: 1rem;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <h1>Food Menu</h1>
    <p>Select an option:</p>
    <div>
    <button id="foodbtn">Order Food</button>
    <button id="foodResetbtn">Reset</button>

    <p id="foodoutput">Select your favorite food!</p>
    </div>

    <div>
    <button id="beveragersbtn">Order Beverages</button>
    <button id="beveragersResetbtn">Reset</button>

    <p id="beveragersoutput">Select your favorite beverage!</p>
    </div>

    <div>
    <button id="icecreambtn">Order Ice Cream</button>       
    <button id="icecreamResetbtn">Reset</button>

    <p id="icecreamoutput">Select your favorite ice cream!</p>


    <script src="Script.js"></script>
  </body>
</html>
