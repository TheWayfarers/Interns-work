<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Expense Tracker</h1>
        <p>Track your daily expenses and manage your spending easily.</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <div class="form">
                    <div class="input-box">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="1">
                    </div>

                    <div class="input-box">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="note">Note</label>
                        <input
                            type="text"
                            id="note"
                            placeholder="Enter note"
                        >
                    </div>
                </div>

                <button type="submit" id="submit-btn">
                    Add Expense
                </button>
            </form>
        </section>

        <section class="summary">

            <div class="summary-card">
                <h3>Total Spent</h3>
                <p id="totalAmount">₹0</p>
            </div>

            <div class="summary-card">
                <h3>Total Entries</h3>
                <p id="totalEntries">0</p>
            </div>

        </section>

        <section class="card">

            <h2>Filter Expenses</h2>

            <div class="filters">
                <button class="filter-btn active" data-category="All">All</button>
                <button class="filter-btn" data-category="Food">Food</button>
                <button class="filter-btn" data-category="Travel">Travel</button>
                <button class="filter-btn" data-category="Shopping">Shopping</button>
                <button class="filter-btn" data-category="Other">Other</button>
            </div>

        </section>

        <section class="card">

            <h2>Your Expenses</h2>

            <div id="expenseList">

                <div id="emptyState">
                    <h3>No expenses found</h3>
                    <p>Start by adding your first expense.</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>Created by Varshitha | 04 August 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
