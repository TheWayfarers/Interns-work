<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="title">
                <img src="images/tick-tock.png" class="timer-image" alt="Tick Tock">

                <div>
                    <h1>Study Timer</h1>
                    <p>Focus • Study • Take a Break</p>
                </div>
            </div>
        </header>

        <main>

            <section class="timer-section">

                <p id="modeLabel">STUDY TIME</p>

                <div class="duration-box">

                    <div>
                        <label for="studyTime">Study Minutes</label>
                        <input type="number" id="studyTime" value="25" min="1">
                    </div>

                    <div>
                        <label for="breakTime">Break Minutes</label>
                        <input type="number" id="breakTime" value="5" min="1">
                    </div>

                </div>

                <div id="timer">25:00</div>

                <div class="buttons">

                    <button id="startBtn">
                        ▶ Start
                    </button>

                    <button id="pauseBtn">
                        Ⅱ Pause
                    </button>

                    <button id="resetBtn">
                        ↻ Reset
                    </button>

                </div>

                <div class="session-count">
                    🏆 Completed Sessions:
                    <span id="sessionCount">0</span>
                </div>

            </section>

            <section class="message-section">

                <p id="message">
                    📚 Stay focused and keep learning!
                </p>

                <p>Varshitha | 07 August 2026</p>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
