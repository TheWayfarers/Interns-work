<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS DOM Example</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 2rem;
      }
      button {
        margin-right: 0.5rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
      }
      #output {
        margin-top: 1rem;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript in the browser</h1>
    <p>Click the buttons to change the text below.</p>

    <button id="btn-hello">Say Hello</button>
    <button id="btn-reset">Reset</button>

    <p id="output">Waiting for click...</p>

    <script src="script.js"></script>
  </body>
</html>
